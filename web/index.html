<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pen_fight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pen_fight</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Vercel Web Analytics. The script is only served on Vercel deployments, so
    it 404s harmlessly during local development.

    Flutter renders to a canvas and never changes the URL, so Vercel would
    only ever record a single page view. The queue below lets the Dart side
    report screen changes as custom events — see lib/analytics.dart.
  -->
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
    // Called from Dart. Kept tiny and defensive: analytics must never be
    // able to break the game.
    window.penFightTrack = function (name, props) {
      try {
        window.va('event', { name: name, data: props || {} });
      } catch (e) {
        /* analytics is best-effort */
      }
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
